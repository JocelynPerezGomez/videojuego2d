<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cementerio Embrujado - Videojuego 2D</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="bg-dark text-light text-center py-3 border-bottom border-warning">
    <div class="container d-flex flex-column align-items-center">
      <img src="assets/header.png" alt="Cementerio Embrujado" height="80" class="mb-2" />
      <h1 class="h3 text-warning">🎃 Cementerio Embrujado 🎃</h1>
      <p class="mb-0 small">¡¡Atrapa a los fantasmas antes de que escapen!!</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="py-3">
    <div class="container">

      <!-- Instrucciones -->
      <section id="instrucciones" class="alert alert-dark border border-warning text-light py-2 mb-3">
        <strong>¿Como Jugar?</strong> Haz clic sobre los objetos (fantasmas, calabazas, tumbas, zombis y murciélagos)
        para eliminarlos.
                            Contador de Eliminaciones: <span id="contador" class="badge bg-danger fs-6">0</span>
      </section>

      <!-- Canvas -->
      <div class="text-center">
        <canvas id="gameCanvas" width="960" height="540" class="border border-warning rounded shadow"></canvas>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-light text-center py-3 border-top border-warning mt-3">
    <div class="container">
      <p class="mb-0">Creado por:</p>
      <p class="mb-0">Jocelyn Patricia Pérez Gómez</p>
      <p class="mb-0">Numero de Control: 24200830</p>      
    </div>
  </footer>

  <!-- Música de fondo -->
  <audio id="musicaFondo" loop>
    <source src="assets/musica.mp3" type="audio/mpeg" />
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
